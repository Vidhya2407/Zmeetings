version: "3.9"

services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm run start"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_SECRET=${AUTH_SECRET:-change-me-in-staging}
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/zstream}
      - SFU_PROVIDER=${SFU_PROVIDER:-none}
      - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL:-}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    volumes:
      - ./:/app
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
